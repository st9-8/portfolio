        .nav-link {
            position: relative;
            transition: color 0.3s;

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;

            transition: width 0.3s;
        }

        .nav-link.active::after {
            width: 100%;

            transition: all 0.3s;

        .lecture-card:hover {
