    <script>
        (function () {
            try {
                const storedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (storedTheme === 'dark' || (!storedTheme && prefersDark)) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (error) {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        .nav-link {
            position: relative;
            transition: color 0.3s;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: currentColor;
            transition: width 0.3s;
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }

        .event-card {
            transition: all 0.3s;
        }

        .event-card:hover {
            transform: scale(1.02);
        }

        .event-image-wrapper {
            position: relative;
            height: 12rem;
            overflow: hidden;
        }

        .event-image-trigger {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            padding: 0;
            cursor: zoom-in;
        }

        .event-image {
            transition: transform 0.3s;
            object-fit: contain;
            background-color: #111827;
        }

        .event-card:hover .event-image {
            transform: scale(1.05);
        }

        .image-count-badge {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.35rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .carousel-modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1.5rem;
        }

        .carousel-modal.hidden {
            display: none;
        }

        .carousel-content {
            position: relative;
            background: #111827;
            border-radius: 1rem;
            width: min(900px, 100%);
            padding: 1.5rem;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }

        .carousel-image-container {
            position: relative;
            height: min(70vh, 520px);
            border-radius: 0.75rem;
            overflow: hidden;
            background: #0f172a;
        }

        .carousel-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #0f172a;
        }

        .carousel-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            transform: translateY(-50%);
            padding: 0 0.75rem;
        }

        .carousel-button {
            width: 42px;
            height: 42px;
            border-radius: 9999px;
            border: none;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .carousel-button:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .carousel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: #f8fafc;
        }

        .carousel-counter {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .carousel-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            border: none;
            background: rgba(15, 23, 42, 0.6);
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 9999px;
            cursor: pointer;
        }

        body.modal-open {
            overflow: hidden;
        }

        .cta-outline {
            transition: all 0.3s;
        }

        .cta-outline:hover,
        .cta-outline:focus-visible {
            background-color: #111827 !important;
            color: #ffffff !important;
            border-color: #111827 !important;
        }

        .dark .cta-outline:hover,
        .dark .cta-outline:focus-visible {
            background-color: #ffffff !important;
            color: #111827 !important;
            border-color: #ffffff !important;
        }
    </style>
</head>
